<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Highlight Vault</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1a1a1a;
      }
      header {
        padding: 12px 14px 8px;
        border-bottom: 1px solid #eee;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
      }
      main {
        padding: 12px 14px;
      }
      .hlx-setup-warning {
        font-size: 12px;
        color: #92400e;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 10px;
      }
      .hlx-setup-warning a {
        color: inherit;
        font-weight: 600;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #666;
        margin-bottom: 4px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      ul#hlx-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 220px;
        overflow-y: auto;
      }
      ul#hlx-list li {
        border-left: 4px solid #ccc;
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 6px;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 6px;
        align-items: flex-start;
      }
      ul#hlx-list li p {
        margin: 0;
        font-style: italic;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      ul#hlx-list button {
        border: none;
        background: none;
        color: #ef4444;
        cursor: pointer;
        font-size: 11px;
        flex-shrink: 0;
      }
      #hlx-empty {
        font-size: 12px;
        color: #888;
        text-align: center;
        padding: 16px 0;
      }
      button#hlx-save {
        width: 100%;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 9px 0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      button#hlx-save:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #hlx-status {
        font-size: 12px;
        margin-top: 8px;
      }
      footer {
        padding: 8px 14px 12px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
      }
      footer a {
        color: #2563eb;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Highlight Vault</h1>
    </header>
    <main>
      <div id="hlx-warning" class="hlx-setup-warning" style="display: none">
        Set up the server URL and API token in <a id="hlx-open-settings">Settings</a> first.
      </div>

      <label for="hlx-title">Document title</label>
      <input type="text" id="hlx-title" />

      <label>Highlights on this page</label>
      <ul id="hlx-list"></ul>
      <div id="hlx-empty" style="display: none">
        Select some text on the page and pick a color to start highlighting.
      </div>

      <button id="hlx-save">Save &amp; summarize</button>
      <div id="hlx-status"></div>
    </main>
    <footer>
      <a id="hlx-refresh">Refresh</a>
      <a id="hlx-settings">Settings</a>
    </footer>
    <script src="colors.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
