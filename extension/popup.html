<!DOCTYPE html>
<html>
  <head>
    <title>Highlight Research Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <h1>Research Capture</h1>

      <label class="label" for="sessionTitle">Session title</label>
      <input id="sessionTitle" class="input" placeholder="Untitled Research Session" />

      <label class="label" for="userNote">Optional note</label>
      <textarea id="userNote" class="textarea" placeholder="Add your own context..."></textarea>

      <button id="saveSelectionBtn" class="button primary">
        Save Current Selection
      </button>

      <button id="sendSessionBtn" class="button">
        End Session + Send to App
      </button>

      <button id="clearBtn" class="button danger">
        Clear Local Highlights
      </button>

      <section class="stats">
        <strong id="count">0</strong> highlights saved
      </section>

      <section id="highlights" class="highlights"></section>

      <p id="status" class="status"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
