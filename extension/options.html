<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Highlight Vault Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 480px;
        margin: 40px auto;
        color: #1a1a1a;
      }
      h1 {
        font-size: 20px;
      }
      p.hint {
        color: #666;
        font-size: 13px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin: 16px 0 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }
      button {
        margin-top: 20px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #2563eb;
        border: 1px solid #2563eb;
        margin-left: 8px;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Highlight Vault settings</h1>
    <p class="hint">
      Connect the extension to your Highlight Vault dashboard. Get the server URL and API token
      from the dashboard's Settings page.
    </p>

    <label for="serverUrl">Server URL</label>
    <input id="serverUrl" type="text" placeholder="https://your-highlight-vault.example.com" />

    <label for="apiToken">API token</label>
    <input id="apiToken" type="password" placeholder="whx_..." />

    <div>
      <button id="save">Save</button>
      <button id="test" class="secondary">Test connection</button>
    </div>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
